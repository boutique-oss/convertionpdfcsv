<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF → CSV Agent</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3e;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #e2e8f0;
      --muted: #64748b;
      --success: #10b981;
      --error: #ef4444;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 4rem;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #6366f1, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: .5rem;
    }
    header p { color: var(--muted); font-size: 1rem; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      width: 100%;
      max-width: 680px;
    }

    /* Drop zone */
    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 2.5rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      margin-bottom: 1.5rem;
      position: relative;
    }
    .drop-zone:hover, .drop-zone.drag-over {
      border-color: var(--accent);
      background: rgba(99,102,241,.06);
    }
    .drop-zone input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }
    .drop-zone .icon { font-size: 2.5rem; margin-bottom: .75rem; }
    .drop-zone .label { font-size: .95rem; color: var(--muted); }
    .drop-zone .label strong { color: var(--accent); }
    .drop-zone .file-name {
      margin-top: .75rem;
      font-size: .85rem;
      color: var(--success);
      font-weight: 600;
    }

    /* Form grid */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    @media (max-width: 480px) { .form-grid { grid-template-columns: 1fr; } }

    label {
      display: flex;
      flex-direction: column;
      gap: .4rem;
      font-size: .85rem;
      color: var(--muted);
      font-weight: 500;
    }
    label span { color: var(--text); font-size: .8rem; }

    input[type="number"], select {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: .6rem .8rem;
      font-size: .95rem;
      outline: none;
      transition: border-color .2s;
      width: 100%;
    }
    input[type="number"]:focus, select:focus { border-color: var(--accent); }

    /* Range slider */
    .range-row {
      display: flex;
      align-items: center;
      gap: .75rem;
    }
    input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
    }
    .range-val {
      min-width: 2.5rem;
      text-align: right;
      font-size: .9rem;
      color: var(--accent);
      font-weight: 600;
    }

    /* Button */
    button[type="submit"] {
      width: 100%;
      padding: .85rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s, opacity .2s;
    }
    button[type="submit"]:hover:not(:disabled) { background: var(--accent-hover); }
    button[type="submit"]:disabled { opacity: .5; cursor: not-allowed; }

    /* Progress */
    .progress-wrap {
      margin-top: 1.25rem;
      display: none;
    }
    .progress-wrap.visible { display: block; }
    .progress-bar-bg {
      background: var(--border);
      border-radius: 999px;
      height: 6px;
      overflow: hidden;
      margin-bottom: .5rem;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #a78bfa);
      border-radius: 999px;
      width: 0%;
      transition: width .4s ease;
    }
    .progress-label { font-size: .83rem; color: var(--muted); text-align: center; }

    /* Result */
    .result {
      margin-top: 1.25rem;
      border-radius: 10px;
      padding: 1rem 1.25rem;
      display: none;
    }
    .result.success {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(16,185,129,.1);
      border: 1px solid rgba(16,185,129,.3);
    }
    .result.error {
      display: block;
      background: rgba(239,68,68,.1);
      border: 1px solid rgba(239,68,68,.3);
      color: var(--error);
      font-size: .88rem;
    }
    .result-text { font-size: .9rem; color: var(--success); }
    .result-text strong { font-size: 1.05rem; }
    .download-btn {
      padding: .5rem 1rem;
      background: var(--success);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: opacity .2s;
    }
    .download-btn:hover { opacity: .85; }

    footer {
      margin-top: 2rem;
      font-size: .78rem;
      color: var(--muted);
      text-align: center;
    }
    footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>

<header>
  <h1>PDF → CSV Agent</h1>
  <p>Extrait les articles d'un catalogue PDF et génère un fichier CSV tarifaire.</p>
</header>

<div class="card">
  <form id="form">

    <!-- Upload zone -->
    <div class="drop-zone" id="dropZone">
      <input type="file" name="pdf" id="pdfInput" accept=".pdf" required />
      <div class="icon">📄</div>
      <div class="label">Glisse ton PDF ici ou <strong>clique pour choisir</strong></div>
      <div class="file-name" id="fileName"></div>
    </div>

    <!-- Parameters -->
    <div class="form-grid">
      <label>
        Page de
        <div class="range-row">
          <input type="range" id="pageFrom" name="page_from" min="1" max="300" value="1" />
          <span class="range-val" id="pageFromVal">1</span>
        </div>
      </label>

      <label>
        Page à
        <div class="range-row">
          <input type="range" id="pageTo" name="page_to" min="1" max="300" value="10" />
          <span class="range-val" id="pageToVal">10</span>
        </div>
      </label>

      <label>
        Marge %
        <input type="number" name="margin_pct" value="30" min="0" max="100" step="0.5" />
      </label>

      <label>
        Unité par défaut
        <select name="default_unit">
          <option value="Pièce">Pièce</option>
          <option value="ML">ML</option>
          <option value="M²">M²</option>
          <option value="Rouleau">Rouleau</option>
        </select>
      </label>

      <label style="grid-column: 1 / -1;">
        Mot de passe PDF <span>(optionnel — si le fichier est protégé)</span>
        <input type="password" name="password" placeholder="Laisser vide si non protégé" autocomplete="off" />
      </label>
    </div>

    <button type="submit" id="submitBtn">Extraire → CSV</button>

    <!-- Progress -->
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-bar-bg"><div class="progress-bar" id="progressBar"></div></div>
      <div class="progress-label" id="progressLabel">Analyse en cours…</div>
    </div>

    <!-- Result -->
    <div class="result" id="result"></div>

  </form>
</div>

<footer>
  <a href="https://github.com/boutique-oss/convertionpdfcsv" target="_blank">Code source</a>
  &nbsp;·&nbsp; Propulsé par Claude Sonnet
</footer>

<script>
  // Sliders
  const pageFrom = document.getElementById('pageFrom');
  const pageTo   = document.getElementById('pageTo');
  const pfv      = document.getElementById('pageFromVal');
  const ptv      = document.getElementById('pageToVal');
  pageFrom.addEventListener('input', () => pfv.textContent = pageFrom.value);
  pageTo.addEventListener('input',   () => ptv.textContent = pageTo.value);

  // Drop zone
  const dropZone = document.getElementById('dropZone');
  const pdfInput = document.getElementById('pdfInput');
  const fileName = document.getElementById('fileName');

  pdfInput.addEventListener('change', () => {
    if (pdfInput.files[0]) fileName.textContent = pdfInput.files[0].name;
  });
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    const f = e.dataTransfer.files[0];
    if (f && f.name.endsWith('.pdf')) {
      const dt = new DataTransfer();
      dt.items.add(f);
      pdfInput.files = dt.files;
      fileName.textContent = f.name;
    }
  });

  // Form submit
  const form      = document.getElementById('form');
  const submitBtn = document.getElementById('submitBtn');
  const progressWrap = document.getElementById('progressWrap');
  const progressBar  = document.getElementById('progressBar');
  const progressLbl  = document.getElementById('progressLabel');
  const result       = document.getElementById('result');

  form.addEventListener('submit', async e => {
    e.preventDefault();

    result.className = 'result';
    result.innerHTML = '';
    progressWrap.classList.add('visible');
    progressBar.style.width = '5%';
    progressLbl.textContent = 'Envoi du fichier…';
    submitBtn.disabled = true;

    try {
      // 1. Upload → reçoit un job_id immédiatement
      const fd = new FormData(form);
      const uploadResp = await fetch('/extract', { method: 'POST', body: fd });
      if (!uploadResp.ok) {
        const err = await uploadResp.json();
        throw new Error(err.detail || 'Erreur envoi');
      }
      const { job_id } = await uploadResp.json();

      progressBar.style.width = '20%';
      progressLbl.textContent = 'Analyse IA en cours…';

      // 2. Polling toutes les 3s jusqu'à done/error
      let pct = 20;
      const ticker = setInterval(() => {
        if (pct < 90) { pct += 2; progressBar.style.width = pct + '%'; }
      }, 1500);

      await new Promise((resolve, reject) => {
        const started = Date.now();
        const poll = setInterval(async () => {
          if (Date.now() - started > 600_000) {
            clearInterval(poll); clearInterval(ticker);
            reject(new Error('Délai dépassé (10 min). Essaie avec moins de pages.'));
            return;
          }
          try {
            const s = await fetch(`/status/${job_id}`);
            const data = await s.json();
            if (data.status === 'done') {
              clearInterval(poll); clearInterval(ticker);
              resolve(data);
            } else if (data.status === 'error') {
              clearInterval(poll); clearInterval(ticker);
              reject(new Error(data.error));
            }
          } catch (e) { /* réseau temporaire, on réessaie */ }
        }, 3000);
      }).then(async (data) => {
        progressBar.style.width = '100%';
        progressWrap.classList.remove('visible');

        // 3. Téléchargement du CSV
        const dlResp = await fetch(`/download/${job_id}`);
        const blob = await dlResp.blob();
        const url = URL.createObjectURL(blob);

        result.className = 'result success';
        result.innerHTML = `
          <div class="result-text"><strong>${data.count}</strong> articles extraits</div>
          <a class="download-btn" href="${url}" download="articles.csv">Télécharger CSV</a>
        `;
      });

    } catch (err) {
      progressWrap.classList.remove('visible');
      result.className = 'result error';
      result.textContent = err.message;
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
